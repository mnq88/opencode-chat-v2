name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify dist is in sync with src
        run: |
          npm run clean
          npm run build
          if ! git diff --quiet -- dist; then
            echo "dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi
      - name: Verify entrypoint resolves
        run: node -e "import('./server.js').then((m) => { if (m.default.id !== 'opencode-chat-v2') process.exit(1) })"
